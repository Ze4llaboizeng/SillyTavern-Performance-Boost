<!-- Performance Boost — Settings Panel
     Injected into SillyTavern's #extensions_settings container -->

<div id="pb-settings-panel" class="extension_container">
    <div class="extension_header">
        <div class="extension_header_title">
            <b>⚡ Performance Boost</b>
        </div>
        <div class="extension_header_toggle">
            <label class="checkbox_label" for="pb-enabled" title="Enable/Disable the extension">
                <input type="checkbox" id="pb-enabled" />
                <span>Enable</span>
            </label>
        </div>
    </div>

    <div class="extension_content" id="pb-settings-content">

        <!-- Device Info Banner -->
        <div id="pb-device-info">
            <span id="pb-device-info-text">Detecting device…</span>
        </div>

        <!-- Device Detection -->
        <div class="pb-section-title">Device Profile</div>

        <label class="checkbox_label" for="pb-auto-detect" title="Automatically detect device and apply best settings">
            <input type="checkbox" id="pb-auto-detect" />
            <span>Auto-detect device tier</span>
        </label>

        <div style="margin-top:6px;">
            <label for="pb-device-tier" style="font-size:0.85rem;">Manual tier override:</label>
            <select id="pb-device-tier" class="text_pole" style="margin-left:6px; width:auto;">
                <option value="auto">Auto (recommended)</option>
                <option value="low">🔴 Low  (≤1 GB RAM)</option>
                <option value="medium">🟡 Medium (2–3 GB)</option>
                <option value="high">🟢 High  (4+ GB)</option>
            </select>
        </div>

        <button id="pb-redetect-btn" class="menu_button" style="margin-top:8px; font-size:0.8rem;">
            Re-detect Device
        </button>

        <!-- Optimizations -->
        <div class="pb-section-title" style="margin-top:14px;">Optimizations</div>

        <label class="checkbox_label" for="pb-virtual-scroll"
               title="Use content-visibility CSS and IntersectionObserver to skip rendering off-screen messages">
            <input type="checkbox" id="pb-virtual-scroll" />
            <span>Virtual Scrolling</span>
        </label>
        <small style="display:block; opacity:0.6; margin: 2px 0 6px 24px;">
            Skips layout/paint for messages outside the viewport. Biggest perf win.
        </small>

        <label class="checkbox_label" for="pb-aggressive-mode"
               title="Low-end mode: hide content of messages far above the fold (extra savings)">
            <input type="checkbox" id="pb-aggressive-mode" />
            <span>Aggressive mode <small style="opacity:0.6;">(auto-enabled for LOW tier)</small></span>
        </label>

        <label class="checkbox_label" for="pb-lazy-images" style="margin-top:6px;"
               title="Defer loading of character avatars and expression images until visible">
            <input type="checkbox" id="pb-lazy-images" />
            <span>Lazy Image Loading</span>
        </label>

        <label class="checkbox_label" for="pb-scroll-optimizer" style="margin-top:6px;"
               title="Passive scroll listeners and RAF throttling">
            <input type="checkbox" id="pb-scroll-optimizer" />
            <span>Scroll Optimizer</span>
        </label>

        <label class="checkbox_label" for="pb-reduce-animations" style="margin-top:6px;"
               title="Disable CSS transitions and animations (auto-enabled for LOW tier)">
            <input type="checkbox" id="pb-reduce-animations" />
            <span>Reduce Animations</span>
        </label>

        <label class="checkbox_label" for="pb-memory-monitor" style="margin-top:6px;"
               title="Watch JS heap usage and message count; escalate virtual scrolling under pressure">
            <input type="checkbox" id="pb-memory-monitor" />
            <span>Memory Monitor</span>
        </label>
        <small style="display:block; opacity:0.6; margin: 2px 0 6px 24px;">
            Triggers aggressive virtual scroll when memory is tight. Chrome/Edge only for heap stats.
        </small>

    </div><!-- /extension_content -->
</div><!-- /pb-settings-panel -->
